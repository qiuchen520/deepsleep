dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  http: ^1.2.2
  sqflite: ^2.4.1
  path: ^1.9.0
  path_provider: ^2.1.5
  shared_preferences: ^2.3.3
  flutter_secure_storage: ^9.2.4
  file_picker: ^8.1.7
  flutter_markdown: ^0.7.6
  markdown: ^7.2.2
  url_launcher: ^6.3.1
  share_plus: ^10.1.4
  uuid: ^4.5.1
  crypto: ^3.0.6
  archive: ^3.6.1
  flutter_tts: ^4.2.5
  speech_to_text: ^7.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
